id: ORX-0025
slug: castro-de-barona-misterio
title: El secreto del castro del mar
subtitle: Una aventura entre murallas, roca y océano
municipality: Porto do Son
province: A Coruña
coordinates:
  lat: 42.6945
  lng: -9.03178
category: Misterio y arqueología
ageRecommended: 8-14 años
duration: 75 min
distance: 1,5 km aprox.
difficulty: Media
accessibility: Acceso a pie con terreno irregular, roca y desniveles; no apto para todas las movilidades.
descriptionShort: Investiga el Castro de Baroña y descubre cómo un poblado de la Edad del Hierro se protegía frente al mar.
descriptionLong: Una misión de observación y arqueología para recorrer el entorno público del Castro de Baroña y reconstruir
  cómo pudo organizarse este asentamiento costero.
story:
  title: La aldea que mira al Atlántico
  introduction: Antes de que existieran carreteras, una comunidad eligió una península rocosa como hogar. Hoy quedan muros,
    formas y preguntas.
  historicalContext: Turismo de Galicia sitúa la ocupación del Castro de Baroña entre el siglo I a.C. y el siglo I d.C. y
    destaca su posición en una península separada de tierra por un istmo, con un foso defensivo.
  mystery: Debes descubrir por qué sus habitantes eligieron exactamente ese lugar.
mission:
  objective: Reconocer elementos defensivos y comprender la relación entre asentamiento, mar y territorio.
  location: Entorno exterior y recorrido público del Castro de Baroña.
  instructions:
  - Sigue siempre el sendero señalizado.
  - No subas a muros ni estructuras arqueológicas.
  - Observa desde fuera y utiliza la ficha para registrar tus hallazgos.
  - No te acerques a los acantilados.
materials:
- Ficha
- Lápiz
- Móvil opcional
challenge:
  title: 'Reto final: El código de los castrexos'
  introduction: Cinco pruebas te permitirán reconstruir las defensas del poblado.
  steps:
  - type: observation
    title: La entrada
    prompt: ¿Qué accidente del terreno separa la península del resto de la costa?
    answer: Un istmo de arena
    hint: Es una franja estrecha de tierra.
  - type: history
    title: La época
    prompt: ¿En qué gran periodo se sitúa el origen del asentamiento?
    answer: Edad del Hierro
    hint: Es anterior a la época romana.
  - type: search
    title: La defensa
    prompt: ¿Qué elemento defensivo se encuentra en el istmo?
    answer: Un foso
    hint: Está excavado antes de las murallas.
  - type: observation
    title: El horizonte
    prompt: ¿Qué recurso natural domina el entorno y pudo favorecer la vida del poblado?
    answer: El mar
    hint: Está presente en casi todas las vistas.
  - type: final
    title: La clave
    prompt: '¿Por qué este lugar era estratégico? Responde con una palabra: PROTECCIÓN, DECORACIÓN o APARCAMIENTO.'
    answer: PROTECCIÓN
    hint: Piensa como alguien que debía defender su hogar.
  successCondition: Completar las cinco pruebas y obtener PROTECCIÓN.
clues:
- El terreno forma parte de la defensa.
- Mira primero la entrada.
- El mar no es solo paisaje.
solution:
  explanation: Baroña se asentó en una península rocosa y su acceso estaba protegido por un istmo con un foso. La ubicación
    ofrecía una posición estratégica frente al territorio y el mar.
