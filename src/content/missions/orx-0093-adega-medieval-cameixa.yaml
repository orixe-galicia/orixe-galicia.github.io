mission:
  objective: Descubrir qué cuenta Adega medieval de Parada de Cameixa sobre la historia, cultura o patrimonio de Galicia.
  location: Adega medieval de Parada de Cameixa, Boborás.
  instructions:
  - Lee la misión antes de comenzar.
  - Trabaja en equipo.
  - No toques ni muevas elementos patrimoniales.
  - Respeta horarios y zonas restringidas.
  - No leas la solución hasta terminar.
