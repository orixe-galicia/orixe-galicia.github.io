challenge:
  title: 'Reto: La bodega escondida'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Localiza entrada, muros y piedra conservada.
  - type: search
    prompt: Averigua la relación con el Mosteiro de Acibeiro.
  - type: history
    prompt: Explica qué cuenta una bodega sobre la economía rural.
  - type: puzzle
    prompt: Une vino + monasterio + arquitectura.
  - type: final
    prompt: Explica por qué una construcción de trabajo también es patrimonio.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Adega medieval de Parada
    de Cameixa. No se trata solo de memorizar un dato, sino de explicar la conexión entre las pistas.
