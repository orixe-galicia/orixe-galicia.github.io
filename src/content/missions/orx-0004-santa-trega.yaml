descriptionShort: "Recorre el castro de Santa Trega y descubre cómo vivían sus habitantes mientras resuelves un misterio arqueológico."
descriptionLong: "Santa Trega conserva uno de los grandes poblados castrexos de Galicia. La misión propone recorrer el entorno exterior del yacimiento, observar sus viviendas, murallas y paisaje y reconstruir una pequeña historia a partir de pistas que están a la vista."
story:
  title: "El mensaje que quedó entre las piedras"
  introduction: "Imagina que has llegado a Santa Trega hace casi dos mil años. El poblado está lleno de vida, pero alguien ha escondido un mensaje que solo puede reconstruirse observando las casas y el paisaje. Tu equipo tendrá que convertirse en exploradores castrexos."
  historicalContext: "El monte Santa Trega conserva un importante asentamiento de época castrexa, situado sobre la desembocadura del Miño y el Atlántico. Las construcciones circulares, las murallas y la organización del poblado permiten imaginar parte de la vida de sus habitantes. El yacimiento es uno de los grandes referentes de la arqueología de Galicia."
  mystery: "Un pequeño grupo de arqueólogos ha encontrado referencias a un mensaje perdido. No hay que excavar ni tocar ninguna pieza: las pistas están en lo que puedes observar. Si consigues reunirlas, descubrirás qué protegía realmente aquella comunidad."
mission:
  objective: "Reconstruir el mensaje de los antiguos habitantes del castro utilizando únicamente observación, orientación y las pistas visibles del recorrido."
  location: "Entorno exterior del Castro de Santa Trega, A Guarda."
  instructions:
    - "Lee la historia antes de comenzar y prepara lápiz y papel o el móvil para anotar."
    - "No entres en zonas cerradas, no subas a muros y no toques restos arqueológicos."
    - "Completa las pruebas en orden y conserva las respuestas hasta el final."
    - "Cuando tengas la palabra final, comprueba la solución únicamente después de terminar."
materials:
  - "Ficha de la misión"
  - "Lápiz o móvil para anotar"
  - "Calzado cómodo"
challenge:
  title: "El código del poblado"
  introduction: "Cinco pruebas te permitirán reconstruir una palabra. Observa antes de responder: en esta misión, mirar bien vale más que correr."
  steps:
    - type: "observation"
      title: "La forma de las casas"
      prompt: "Busca una de las construcciones circulares del poblado. ¿Qué forma domina en sus paredes?"
      answer: "Circular"
      hint: "Piensa en la geometría de muchas viviendas castrexas."
    - type: "search"
      title: "La defensa"
      prompt: "Localiza una de las zonas de muralla. ¿Para qué crees que servía principalmente?"
      options:
        - "Para decorar el poblado"
        - "Para protegerlo"
        - "Para recoger agua"
      answer: "Para protegerlo"
      hint: "Una muralla tiene una función muy concreta."
    - type: "observation"
      title: "Mira hacia el horizonte"
      prompt: "Desde el monte puedes ver el encuentro entre el río Miño y el océano Atlántico. ¿Qué gran accidente geográfico domina el paisaje hacia el oeste?"
      answer: "El océano Atlántico"
      hint: "Es la gran extensión de agua que se abre frente a Galicia."
    - type: "history"
      title: "La vida del castro"
      prompt: "¿Qué opción describe mejor el lugar que estás recorriendo?"
      options:
        - "Un poblado de viviendas y espacios comunitarios"
        - "Un palacio romano"
        - "Una fortaleza medieval"
      answer: "Un poblado de viviendas y espacios comunitarios"
      hint: "Piensa en quién vivía aquí."
    - type: "final"
      title: "La palabra perdida"
      prompt: "Ordena las cuatro ideas anteriores: CASA + DEFENSA + MAR + COMUNIDAD. ¿Qué palabra resume mejor el secreto que protege el castro?"
      answer: "PUEBLO"
      hint: "No busques una palabra arqueológica complicada. Piensa en lo que formaban juntos todos aquellos habitantes."
  successCondition: "Completar las cinco pruebas y obtener la palabra final PUEBLO."
clues:
  - "Si una respuesta parece demasiado fácil, vuelve a mirar el entorno antes de decidir."
  - "Las piedras no hablan, pero su forma sí cuenta una historia."
solution:
  explanation: "Las viviendas circulares, las defensas y la posición estratégica del asentamiento muestran que Santa Trega fue un poblado organizado y no un conjunto de construcciones aisladas. La palabra final propuesta es PUEBLO: la misión pretende que el jugador entienda el castro como un lugar donde vivía una comunidad."
