descriptionShort: "Explora el Castro de Baroña y descubre cómo una comunidad castrexa convirtió una península en una fortaleza frente al Atlántico."
descriptionLong: "El Castro de Baroña es un yacimiento castrexo declarado Bien de Interés Cultural. Su posición sobre una pequeña península, el istmo de arena y sus defensas convierten el lugar en un escenario natural perfecto para una misión de observación y arqueología."
story:
  title: "La última guardia de Baroña"
  introduction: "El poblado está tranquilo, pero alguien ha dejado una orden para la última guardia: antes de abandonar la fortaleza hay que comprobar que el mar, las murallas y el acceso siguen protegidos."
  historicalContext: "El Castro de Baroña se sitúa en una pequeña península rocosa separada de tierra firme por un istmo de arena. Turismo de Galicia sitúa su ocupación principal entre el siglo I a.C. y el siglo I d.C. y destaca un foso de unos cuatro metros de ancho y tres de profundidad en el acceso."
  mystery: "Las defensas no están todas construidas por las personas: la propia geografía forma parte del sistema. Para resolver la misión tendrás que distinguir entre defensa natural y defensa construida."
mission:
  objective: "Reconstruir el sistema defensivo del Castro de Baroña mediante observación, orientación e historia."
  location: "Entorno exterior del Castro de Baroña, Porto do Son."
  instructions:
    - "Mantente en los caminos y zonas autorizadas del yacimiento."
    - "No subas a muros, no toques restos arqueológicos y no recojas materiales."
    - "Observa el istmo, el mar y las defensas antes de responder."
    - "Guarda las respuestas para resolver el código final."
materials:
  - "Ficha de la misión"
  - "Lápiz o móvil"
  - "Calzado con buena sujeción"
challenge:
  title: "Reto final: La defensa perfecta"
  introduction: "Cinco pruebas para descubrir por qué este poblado podía defenderse con ayuda de la propia costa."
  steps:
    - type: "observation"
      title: "Una isla sin ser isla"
      prompt: "¿Qué forma geográfica conecta la península del castro con tierra firme?"
      answer: "Un istmo de arena"
      hint: "Es una franja estrecha de tierra."
    - type: "search"
      title: "La primera defensa"
      prompt: "En el acceso al castro se documenta un foso de aproximadamente cuatro metros de ancho y tres de profundidad. ¿Para qué servía?"
      answer: "Dificultar el acceso al poblado"
      hint: "Piensa como alguien que quiere impedir una entrada."
    - type: "history"
      title: "La época"
      prompt: "¿Entre qué siglos sitúa Turismo de Galicia la ocupación principal del Castro de Baroña?"
      answer: "Siglo I a.C. a siglo I d.C."
      hint: "Es un periodo de transición entre la Edad del Hierro y la romanización."
    - type: "observation"
      title: "La defensa natural"
      prompt: "Además de las construcciones, ¿qué elemento natural rodea gran parte del asentamiento?"
      answer: "El mar"
      hint: "Mira hacia los tres frentes de la península."
    - type: "final"
      title: "La clave"
      prompt: "Une ISTMO + FOSO + MAR + POBLADO. ¿Qué palabra resume la misión?"
      answer: "DEFENSA"
      hint: "Es lo que estás reconstruyendo."
  successCondition: "Completar las cinco pruebas y obtener la palabra final DEFENSA."
clues:
  - "El paisaje es una parte de la fortaleza."
  - "No confundas el foso con una simple depresión del terreno."
  - "Mira siempre hacia el mar y hacia el acceso terrestre."
solution:
  explanation: "Baroña combina defensas construidas y defensas naturales. El istmo conecta el asentamiento con tierra firme, mientras el foso dificulta el acceso y el mar protege gran parte de la península. Su ocupación principal se sitúa entre el siglo I a.C. y el siglo I d.C."
