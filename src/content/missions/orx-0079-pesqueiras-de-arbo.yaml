story:
  title: El misterio de Pesqueiras de Arbo
  introduction: El lugar es el tablero. Las pistas están a la vista y la historia es la llave.
  historicalContext: Investiga el contexto histórico y cultural de Pesqueiras de Arbo utilizando la información disponible
    en el lugar y las fuentes oficiales de turismo.
  mystery: Un antiguo cuaderno dejó cinco pruebas sin resolver. Solo podrás abrir el mensaje final si conectas lo que observas
    con la historia del lugar.
mission:
  objective: Descubrir qué cuenta Pesqueiras de Arbo sobre la historia, cultura o patrimonio de Galicia.
  location: Pesqueiras de Arbo, Arbo.
  instructions:
  - Lee la misión antes de comenzar.
  - Trabaja en equipo.
  - No toques ni muevas elementos patrimoniales.
  - Respeta horarios y zonas restringidas.
  - No leas la solución hasta terminar.
materials:
- Ficha imprimible
- Lápiz
- Móvil opcional
challenge:
  title: 'Reto: Los arquitectos del Miño'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Identifica la estructura de una pesqueira.
  - type: search
    prompt: Averigua qué pez se relaciona con ellas.
  - type: history
    prompt: Explica por qué son arquitectura e ingeniería.
  - type: puzzle
    prompt: Une río + piedra + economía.
  - type: final
    prompt: Explica por qué forman parte del patrimonio cultural.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Pesqueiras de Arbo. No
    se trata solo de memorizar un dato, sino de explicar la conexión entre las pistas.
