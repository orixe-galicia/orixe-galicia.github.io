recommendations:
- Llevar agua y calzado cómodo.
- Comprobar las condiciones del lugar antes de comenzar.
warnings:
- Respetar siempre las zonas cerradas o restringidas.
- La misión debe realizarse con atención al entorno y sin ponerse en riesgo.
