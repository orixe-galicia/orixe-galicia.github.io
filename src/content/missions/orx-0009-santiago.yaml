gallery: []
descriptionShort: Convierte el casco histórico de Santiago en un escape room gratuito entre plazas, peregrinos y monumentos.
descriptionLong: 'El centro histórico de Santiago de Compostela reúne plazas, iglesias, monasterios, palacios y calles que
  forman parte del Patrimonio Mundial. Esta misión propone mirar la ciudad como un gran tablero: cuatro plazas alrededor de
  la Catedral esconden las pistas que permiten resolver el código final.'
story:
  title: El mensaje de las cuatro puertas
  introduction: 'Alguien ha dejado un mensaje para quien consiga recorrer las cuatro plazas que rodean la Catedral. No está
    escrito en una pared: cada plaza aporta una pieza y solo juntas revelan la palabra final.'
  historicalContext: 'El casco histórico de Santiago fue declarado Patrimonio de la Humanidad por la UNESCO en 1985. Alrededor
    de la Catedral se encuentran cuatro grandes plazas: Obradoiro, Quintana, Praterías y Acibechería, cada una con edificios
    y perspectivas diferentes.'
  mystery: El mensaje solo puede reconstruirse si aprendes a reconocer qué edificio pertenece a cada plaza y qué historia
    cuenta el conjunto.
mission:
  objective: Recorrer las cuatro plazas principales alrededor de la Catedral y resolver un código de observación e historia.
  location: Casco histórico de Santiago de Compostela, especialmente el entorno de la Catedral.
  instructions:
  - Realiza la misión desde espacios públicos y sin necesidad de entrar en edificios.
  - 'Observa primero y responde después: muchas pistas están en las fachadas y en la forma de las plazas.'
  - Respeta el paso de peregrinos, vecinos y grupos turísticos.
  - Anota las respuestas porque serán necesarias para el Reto Final.
materials:
- Ficha de la misión
- Lápiz o móvil
- Calzado cómodo
challenge:
  title: 'Reto final: Abrir el código de Compostela'
  introduction: 'Cuatro plazas, cuatro pistas y una palabra final. El objetivo no es correr: es aprender a leer la ciudad.'
  steps:
  - type: observation
    title: La plaza monumental
    prompt: ¿Cómo se llama la plaza donde se encuentran la fachada principal de la Catedral, el Pazo de Raxoi, San Xerome
      y el Hostal dos Reis Católicos?
    answer: Obradoiro
    hint: Es la plaza más monumental de Santiago.
  - type: observation
    title: La plaza de los dos espacios
    prompt: Busca la plaza que se divide en dos ámbitos separados por unas escalinatas y donde se encuentra la Porta Santa
      de la Catedral.
    answer: Quintana
    hint: Su nombre distingue dos espacios de la misma plaza.
  - type: history
    title: La plaza de los artesanos
    prompt: ¿Qué plaza está asociada a la fachada barroca de Praterías y a la tradición de los talleres de orfebrería?
    answer: Praterías
    hint: Piensa en el trabajo de la plata.
  - type: search
    title: La cuarta pieza
    prompt: ¿Qué plaza se encuentra al norte de la Catedral y recibe también el nombre de plaza de la Inmaculada?
    answer: Acibechería
    hint: Su nombre tradicional está relacionado con el azabache.
  - type: final
    title: La palabra final
    prompt: Une las cuatro plazas y explica qué tienen en común. ¿Qué palabra resume mejor lo que estás recorriendo?
    answer: PATRIMONIO
    hint: 'No es solo una ciudad: es un conjunto reconocido y protegido.'
  successCondition: Completar las cinco pruebas y obtener la palabra final PATRIMONIO.
clues:
- La Catedral es tu centro de referencia.
- Las cuatro plazas forman un recorrido alrededor de la basílica.
- Si dudas, busca primero los nombres de las plazas.
solution:
  explanation: Las cuatro plazas principales alrededor de la Catedral —Obradoiro, Quintana, Praterías y Acibechería— permiten
    descubrir diferentes caras del casco histórico. Santiago fue declarado Patrimonio de la Humanidad en 1985 y su conjunto
    de calles, templos, palacios y plazas es el verdadero tablero de la misión.
badge:
