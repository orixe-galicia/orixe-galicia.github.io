recommendations:
- Puedes completar la misión sin entrar en la Catedral ni en museos.
- Evita las horas de mayor afluencia si quieres observar las plazas con calma.
warnings:
- Es un entorno urbano muy concurrido.
- No bloquees accesos ni interrumpas el paso de peregrinos.
