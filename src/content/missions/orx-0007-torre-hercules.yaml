descriptionShort: "Descifra un mensaje recorriendo el entorno de la Torre de Hércules y descubre su historia romana y sus leyendas."
descriptionLong: "La Torre de Hércules es un faro romano construido en la Antigüedad y declarado Patrimonio Mundial. Esta misión se realiza principalmente en el espacio exterior y convierte el faro, el mar y las referencias a Roma y Hércules en un juego de pistas."
story:
  title: "La señal que nunca desapareció"
  introduction: "Un mensaje romano ha sobrevivido durante casi dos mil años. Para encontrarlo no necesitas entrar en la torre: debes aprender a mirar como un navegante y descubrir las señales que rodean el faro."
  historicalContext: "La Torre de Hércules se construyó en época romana, en el siglo I, y continúa funcionando como señal marítima. La tradición histórica relaciona el lugar con la navegación hacia el noroeste europeo. La leyenda de Hércules y Gerión añadió otra capa mítica a la identidad del lugar."
  mystery: "El mensaje mezcla hechos históricos y leyenda. Tu misión consiste en separar ambos mundos y utilizar las respuestas para obtener el código final."
mission:
  objective: "Resolver un código de cinco pruebas sobre navegación, Roma, la torre y la leyenda de Hércules."
  location: "Entorno exterior de la Torre de Hércules y Parque Escultórico."
  instructions:
    - "Realiza la misión desde los espacios exteriores y públicos."
    - "No es necesario comprar una entrada para resolver el reto."
    - "No cruces zonas restringidas ni te acerques a los bordes del acantilado."
    - "Distingue siempre entre historia documentada y leyenda."
materials:
  - "Ficha de la misión"
  - "Lápiz o móvil"
  - "Calzado cómodo"
challenge:
  title: "La clave de Brigantium"
  introduction: "Cinco preguntas separan la historia de la leyenda y te acercan a la palabra final."
  steps:
    - type: "history"
      title: "El origen"
      prompt: "¿En qué época comenzó la construcción de la Torre de Hércules?"
      options:
        - "Siglo I"
        - "Siglo XV"
        - "Siglo XIX"
      answer: "Siglo I"
      hint: "Es una construcción romana."
    - type: "observation"
      title: "La señal"
      prompt: "¿Cuál era una de las funciones fundamentales de la torre?"
      answer: "Servir de faro y guiar a los navegantes"
      hint: "Piensa en barcos y navegación."
    - type: "history"
      title: "El arquitecto"
      prompt: "Según la inscripción vinculada al monumento, ¿cómo se llamaba el arquitecto romano asociado a su construcción?"
      answer: "Gaio Sevio Lupo"
      hint: "Su nombre aparece relacionado con una inscripción de la torre."
    - type: "question"
      title: "Historia o leyenda"
      prompt: "La historia de Hércules derrotando al gigante Gerión pertenece principalmente al terreno de..."
      options:
        - "La leyenda y la mitología"
        - "La arqueología romana"
        - "La cartografía medieval"
      answer: "La leyenda y la mitología"
      hint: "No todo lo que cuenta una tradición es un hecho histórico."
    - type: "final"
      title: "El mensaje"
      prompt: "Si un faro lleva casi dos mil años guiando a quienes llegan por mar, ¿qué palabra representa mejor su misión?"
      answer: "LUZ"
      hint: "Es lo que buscas cuando navegas de noche."
  successCondition: "Completar las pruebas y obtener la palabra final LUZ."
clues:
  - "La inscripción es una pista histórica, no una leyenda."
  - "Cuando aparezca Hércules, recuerda que estás entrando en el mundo del mito."
solution:
  explanation: "La Torre de Hércules tiene origen romano y ha funcionado como señal marítima durante una parte extraordinariamente larga de su historia. La misión distingue ese patrimonio documentado de la tradición mítica de Hércules y Gerión. La palabra LUZ resume la función simbólica y práctica del faro."
