story:
  title: El misterio de Mosteiro de San Pedro de Rocas
  introduction: El lugar es el tablero. Las pistas están a la vista y la historia es la llave.
  historicalContext: Investiga el contexto histórico y cultural de Mosteiro de San Pedro de Rocas utilizando la información
    disponible en el lugar y las fuentes oficiales de turismo.
  mystery: Un antiguo cuaderno dejó cinco pruebas sin resolver. Solo podrás abrir el mensaje final si conectas lo que observas
    con la historia del lugar.
mission:
  objective: Descubrir qué cuenta Mosteiro de San Pedro de Rocas sobre la historia, cultura o patrimonio de Galicia.
  location: Mosteiro de San Pedro de Rocas, Esgos.
  instructions:
  - Lee la misión antes de comenzar.
  - Trabaja en equipo.
  - No toques ni muevas elementos patrimoniales.
  - Respeta horarios y zonas restringidas.
  - No leas la solución hasta terminar.
materials:
- Ficha imprimible
- Lápiz
- Móvil opcional
challenge:
  title: 'Reto: La iglesia excavada en la roca'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Identifica las partes excavadas en la roca.
  - type: search
    prompt: Investiga qué significa eremita.
  - type: history
    prompt: Relaciona roca + aislamiento + vida religiosa.
  - type: puzzle
    prompt: Une antigüedad + roca + monasterio.
  - type: final
    prompt: Explica qué hace único a San Pedro de Rocas.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Mosteiro de San Pedro
    de Rocas. No se trata solo de memorizar un dato, sino de explicar la conexión entre las pistas.
