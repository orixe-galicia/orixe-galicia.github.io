story:
  title: El misterio de Outeiro das Forcadas
  introduction: El lugar es el tablero. Las pistas están a la vista y la historia es la llave.
  historicalContext: Investiga el contexto histórico y cultural de Outeiro das Forcadas utilizando la información disponible
    en el lugar y las fuentes oficiales de turismo.
  mystery: Un antiguo cuaderno dejó cinco pruebas sin resolver. Solo podrás abrir el mensaje final si conectas lo que observas
    con la historia del lugar.
mission:
  objective: Descubrir qué cuenta Outeiro das Forcadas sobre la historia, cultura o patrimonio de Galicia.
  location: Outeiro das Forcadas, Pontevedra.
  instructions:
  - Lee la misión antes de comenzar.
  - Trabaja en equipo.
  - No toques ni muevas elementos patrimoniales.
  - Respeta horarios y zonas restringidas.
  - No leas la solución hasta terminar.
materials:
- Ficha imprimible
- Lápiz
- Móvil opcional
challenge:
  title: 'Reto: El lugar de la justicia'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Busca señales relacionadas con justicia.
  - type: search
    prompt: Investiga el significado histórico del lugar.
  - type: history
    prompt: Explica cómo se administraba justicia antiguamente.
  - type: puzzle
    prompt: Une lugar + poder + memoria.
  - type: final
    prompt: Cuenta qué historia conserva el topónimo.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Outeiro das Forcadas.
    No se trata solo de memorizar un dato, sino de explicar la conexión entre las pistas.
