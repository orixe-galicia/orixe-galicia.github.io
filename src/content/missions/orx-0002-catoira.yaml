descriptionShort: Una aventura histórica para descubrir por qué las Torres de Oeste fueron una pieza clave en la defensa de
  la entrada hacia Compostela.
descriptionLong: 'El Ulla fue durante siglos una vía de entrada hacia el interior de Galicia. En Catoira, las Torres de Oeste
  protegían el paso hacia Compostela. Esta misión convierte el lugar en un escenario de aventura: la familia deberá interpretar
  señales, reconstruir una defensa medieval y descubrir por qué este punto del río era tan importante.'
story:
  title: Alarma en el Ulla
  introduction: 'Es de noche. Desde la desembocadura del Ulla llega una noticia inquietante: varias embarcaciones se acercan
    río arriba. No eres un guerrero. Eres el encargado de transmitir la alarma hasta Compostela. Para conseguirlo tendrás
    que entender primero por qué las Torres están aquí.'
  historicalContext: Las Torres de Oeste se encuentran junto al río Ulla y forman parte del antiguo Castellum Honesti. La
    fortaleza fue reforzada en el siglo XII por orden del arzobispo Diego Gelmírez para cerrar el paso a expediciones escandinavas
    y sarracenas que se dirigían hacia Compostela. El conjunto llegó a contar con siete torres; hoy se conservan dos torres
    y restos de muralla. Las Torres fueron declaradas Monumento Nacional en 1931 y forman parte del escenario de la Romaría
    Vikinga de Catoira.
  mystery: El mensaje de alarma está incompleto. Para reconstruirlo tendrás que descubrir cuatro datos del lugar y convertirlos
    en una orden final.
mission:
  objective: Explorar el entorno de las Torres de Oeste y comprender su función estratégica mediante observación, historia
    y pequeñas pruebas.
  location: Torres de Oeste, Catoira, junto al río Ulla.
  instructions:
  - Observad las torres desde las zonas de acceso público.
  - Imaginad el paisaje antes de los puentes y construcciones actuales.
  - No subáis a estructuras ni accedáis a zonas cerradas.
  - 'Guardad las respuestas: las necesitaréis para transmitir la alarma.'
materials:
- Lápiz o bolígrafo
- Esta ficha
- Móvil opcional
challenge:
  title: 'Reto final: Salvar el paso'
  introduction: La alarma solo funciona si puedes explicar por qué este lugar permitía defender el camino hacia Compostela.
  steps:
  - type: observation
    title: Mira el río
    prompt: ¿Qué elemento natural convierte este lugar en un punto estratégico para controlar embarcaciones?
    answer: el río Ulla
    hint: Las embarcaciones tenían que pasar por aquí para remontar el río.
  - type: history
    title: Cuenta las torres
    prompt: El conjunto defensivo llegó a contar con siete torres. ¿Cuántas se conservan hoy en pie?
    answer: dos
    hint: Son menos de tres.
  - type: history
    title: El constructor
    prompt: ¿Qué arzobispo ordenó reforzar la fortaleza en el siglo XII?
    answer: Diego Gelmírez
    hint: Fue una figura decisiva en el impulso de la peregrinación a Santiago.
  - type: observation
    title: Encuentra la defensa
    prompt: Además de las torres, ¿qué elemento del entorno ayudaba a dificultar el acceso a la fortaleza?
    answer: el terreno pantanoso
    hint: No era una muralla.
  - type: puzzle
    title: Construye el mensaje
    prompt: 'Une estas ideas: ULLA + DOS TORRES + GELMÍREZ + PANTANO. ¿Qué función tenía este lugar?'
    answer: Defender la entrada hacia Compostela
    hint: Piensa en qué debía impedir la fortaleza.
  - type: final
    title: La alarma
    prompt: Explica en una frase por qué un enemigo que quisiera llegar a Compostela tenía que preocuparse por las Torres
      de Oeste.
    answer: Porque controlaban un paso estratégico del río Ulla hacia el interior y Compostela.
    hint: La clave está en la posición de las Torres.
  successCondition: Completar las pruebas y explicar correctamente la función estratégica de las Torres de Oeste.
clues:
- El río es parte de la defensa.
- No todas las defensas son construcciones.
- Busca la relación entre Catoira, el Ulla y Compostela.
solution:
  explanation: Las Torres de Oeste no están colocadas al azar. Su posición junto al Ulla permitía controlar una vía natural
    de entrada hacia el interior. El conjunto defensivo llegó a tener siete torres y fue reforzado en el siglo XII por Diego
    Gelmírez para proteger el acceso hacia Compostela.
