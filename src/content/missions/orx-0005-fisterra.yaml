descriptionShort: "Sigue las huellas de peregrinos, navegantes y leyendas hasta descubrir el mensaje escondido en el Fin del Mundo."
descriptionLong: "Fisterra reúne paisaje atlántico, tradición jacobea, leyendas y una relación histórica con el límite occidental del mundo conocido. Esta misión convierte el entorno exterior del cabo y su paisaje en un pequeño escape room al aire libre."
story:
  title: "Cuando termina el camino"
  introduction: "Has llegado al lugar que durante siglos fue imaginado como el extremo de la tierra. Antes de regresar, debes descubrir un mensaje dejado para quienes se atreven a mirar más allá del horizonte."
  historicalContext: "Fisterra está vinculada a antiguas tradiciones relacionadas con el culto solar, leyendas y la prolongación de la peregrinación hasta el Atlántico. En el Monte do Facho se encuentran los restos de la ermita de San Guillerme y elementos asociados a antiguas prácticas rituales."
  mystery: "El mensaje no está escrito en una pared. Está escondido en el paisaje: en la orientación, el mar, el camino y las señales que encuentras durante el recorrido."
mission:
  objective: "Resolver un código basado en el paisaje y la tradición de Fisterra sin necesidad de pagar ninguna entrada."
  location: "Entorno exterior del Cabo Fisterra y sus espacios públicos."
  instructions:
    - "Comienza en el entorno del faro y observa el paisaje antes de iniciar las pruebas."
    - "No necesitas entrar en ningún edificio para completar la misión."
    - "No te acerques a los acantilados ni abandones los caminos seguros."
    - "Guarda todas las respuestas para resolver el código final."
materials:
  - "Ficha de la misión"
  - "Lápiz o móvil"
  - "Calzado adecuado"
challenge:
  title: "El código del Fin del Mundo"
  introduction: "Cuatro señales te llevarán hasta una palabra final. La clave está en observar cómo se relacionan tierra, mar y camino."
  steps:
    - type: "observation"
      title: "Busca la luz"
      prompt: "¿Qué construcción histórica domina el paisaje del cabo y sirve como señal marítima?"
      answer: "Faro"
      hint: "Su luz ayuda a los barcos."
    - type: "search"
      title: "El camino continúa"
      prompt: "Fisterra está relacionada con una ruta de peregrinación que continúa después de Santiago. ¿Qué ruta es?"
      answer: "Camino de Santiago"
      hint: "Muchos peregrinos llegan hasta aquí después de Compostela."
    - type: "history"
      title: "Entre historia y leyenda"
      prompt: "Según la información histórica y cultural del lugar, ¿qué tradición antigua aparece relacionada con el Monte do Facho?"
      options:
        - "Culto al sol"
        - "Culto al hielo"
        - "Culto a los volcanes"
      answer: "Culto al sol"
      hint: "Mira hacia aquello que domina el horizonte al final del día."
    - type: "observation"
      title: "El horizonte"
      prompt: "Sitúate en un punto seguro con el mar delante. ¿Qué elemento natural representa mejor el límite que buscaban los antiguos viajeros?"
      answer: "El horizonte"
      hint: "Es la línea aparente donde cielo y mar parecen encontrarse."
    - type: "final"
      title: "La palabra final"
      prompt: "Une las cuatro ideas: FARO + CAMINO + SOL + HORIZONTE. ¿Qué concepto resume mejor esta experiencia?"
      answer: "FIN"
      hint: "Es una palabra corta que describe el lugar al que has llegado."
  successCondition: "Completar las pruebas y obtener la palabra final FIN."
clues:
  - "No confundas una leyenda con un hecho histórico: la misión mezcla ambos y te pide distinguirlos."
  - "Si dudas, vuelve a mirar el horizonte."
solution:
  explanation: "La misión utiliza elementos documentados de Fisterra —el faro, la tradición jacobea y las referencias al culto solar en el entorno de San Guillerme— para construir una aventura. La palabra FIN funciona como cierre simbólico del viaje, no como una afirmación histórica."
badge:
  name: "ORIXE 005 · Explorador del Fin del Mundo"
  description: "Insignia de quien llegó al extremo atlántico y resolvió el último mensaje."
  image: "/badges/fisterra.svg"
