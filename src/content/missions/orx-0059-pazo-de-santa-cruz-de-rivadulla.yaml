story:
  title: El misterio de Pazo de Santa Cruz de Rivadulla
  introduction: Alguien ha dejado una misión incompleta. Para resolverla tendrás que mirar con atención, encontrar detalles
    y conectar lo que ves con la historia del lugar.
  historicalContext: Santa Cruz de Rivadulla es conocido por su conjunto histórico y sus jardines, donde agua, vegetación
    y arquitectura forman un escenario excelente para la observación.
  mystery: 'La respuesta no está escondida en una caja: está delante de ti, pero tendrás que aprender a verla.'
mission:
  objective: Resolver las cinco pruebas y construir una explicación final sobre el lugar.
  location: Pazo de Santa Cruz de Rivadulla, Vedra.
  instructions:
  - Lee la ficha antes de comenzar.
  - Respeta el patrimonio y el entorno natural.
  - No salgas de zonas autorizadas.
  - Resuelve las pruebas en equipo.
  - No leas la solución hasta terminar.
materials:
- Ficha imprimible
- Lápiz o móvil
- Curiosidad y ganas de jugar
challenge:
  title: El reto de Pazo de Santa Cruz de Rivadulla
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Observa el entorno durante un minuto. Anota tres detalles que normalmente pasarían desapercibidos.
  - type: search
    prompt: Encuentra un elemento concreto del lugar que pueda servir como pista y describe dónde está.
  - type: history
    prompt: Explica qué relación tiene ese elemento con la historia, paisaje o forma de vida del lugar.
  - type: puzzle
    prompt: Relaciona las tres pistas y descubre qué idea común las une.
  - type: final
    prompt: Formula en una frase el mensaje final de la misión y justifica tu respuesta.
  successCondition: Completar las cinco pruebas y justificar razonadamente el mensaje final.
clues:
- Primero observa; después busca.
- Las mejores pistas suelen estar a la vista.
- Piensa qué te cuenta el lugar, no solo qué estás viendo.
solution:
  explanation: La solución se obtiene relacionando las observaciones con la historia, el paisaje o el patrimonio de Pazo de
    Santa Cruz de Rivadulla. La clave es explicar por qué las pistas encajan.
