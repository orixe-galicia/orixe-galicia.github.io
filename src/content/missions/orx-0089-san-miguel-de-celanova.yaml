mission:
  objective: Descubrir qué cuenta Capela de San Miguel de Celanova sobre la historia, cultura o patrimonio de Galicia.
  location: Capela de San Miguel de Celanova, Celanova.
  instructions:
  - Lee la misión antes de comenzar.
  - Trabaja en equipo.
  - No toques ni muevas elementos patrimoniales.
  - Respeta horarios y zonas restringidas.
  - No leas la solución hasta terminar.
