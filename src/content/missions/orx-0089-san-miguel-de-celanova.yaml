challenge:
  title: 'Reto: El pequeño tesoro de San Miguel'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Observa el tamaño y distribución de la capilla.
  - type: search
    prompt: Investiga qué significa altomedieval.
  - type: history
    prompt: Compara su función con una iglesia mayor.
  - type: puzzle
    prompt: Une tamaño + función + época.
  - type: final
    prompt: Explica por qué una construcción pequeña puede ser excepcional.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Capela de San Miguel
    de Celanova. No se trata solo de memorizar un dato, sino de explicar la conexión entre las pistas.
