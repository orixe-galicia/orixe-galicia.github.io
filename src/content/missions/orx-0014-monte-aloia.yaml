recommendations:
- La misión está diseñada para realizarse sin contratar una actividad guiada.
- Comprueba horarios, accesos y condiciones del lugar antes de salir.
warnings:
- Respeta siempre la señalización y las zonas restringidas.
- La seguridad está por encima de cualquier prueba.
