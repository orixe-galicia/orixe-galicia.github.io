distance: 2-3 km aprox.
difficulty: Fácil-media
accessibility: Recorrido por espacios públicos; algunos senderos presentan desnivel.
image: /images/monte-aloia.svg
gallery: []
descriptionShort: Explora el Monte Aloia con un reto de orientación, paisaje y arqueología
  completamente gratuito.
descriptionLong: El Monte Aloia fue el primer parque natural de Galicia y combina
  miradores, senderos, molinos, patrimonio arqueológico y una muralla ciclópea. La
  misión convierte el monte en un tablero de exploración.
story:
  title: La montaña que guarda cinco vistas
  introduction: Una antigua exploradora dejó cinco señales en el monte. Cada mirador
    revela una pieza del mapa y solo al final podrás reconstruir la palabra escondida.
  historicalContext: El Monte Aloia fue reconocido como parque natural en 1978. Turismo
    de Galicia destaca sus miradores, rutas, molinos y los restos de una muralla ciclópea
    de unos 1.250 metros.
  mystery: Una antigua exploradora dejó cinco señales en el monte. Cada mirador revela
    una pieza del mapa y solo al final podrás reconstruir la palabra escondida.
mission:
  objective: Completar una ruta de observación por el entorno del Monte Aloia y reconstruir
    una palabra a partir del paisaje.
  location: Monte Aloia, Tui.
  instructions:
  - Realiza el recorrido por caminos y espacios públicos.
  - No abandones los senderos para buscar una pista.
  - Observa el paisaje antes de consultar el móvil.
  - Respeta la vegetación y el patrimonio arqueológico.
materials:
- Ficha de misión
- Lápiz o móvil
- Calzado cómodo
challenge:
  title: 'Reto final: Reconstruir el mapa'
  introduction: Cinco pruebas convierten el paisaje en una brújula.
  steps:
  - type: observation
    title: La atalaya
    prompt: ¿Qué gran río domina buena parte del paisaje desde las zonas altas?
    answer: Miño
    hint: Busca el gran valle hacia el sur.
  - type: search
    title: La muralla
    prompt: ¿Qué tipo de construcción arqueológica recibe el nombre de muralla ciclópea?
    answer: Una muralla de grandes piedras
    hint: Piensa en piedras colocadas sin argamasa.
  - type: observation
    title: El bosque
    prompt: Busca dos especies de árboles diferentes y anótalas.
    answer: Respuesta abierta
    hint: Observa sin arrancar hojas.
  - type: coordinates
    title: Los miradores
    prompt: Elige un mirador y anota qué paisaje aparece a sus pies.
    answer: Respuesta abierta
    hint: Describe río, valle o monte.
  - type: final
    title: La palabra
    prompt: '¿Qué cualidad resume mejor al Aloia: EXPLORAR, ENCERRARSE o PERDERSE?'
    answer: EXPLORAR
    hint: Es un lugar pensado para descubrir caminos.
  successCondition: Completar las cinco pruebas y obtener la palabra EXPLORAR.
clues:
- Usa los miradores como puntos de referencia.
- La arqueología también forma parte del paisaje.
- No necesitas recorrer todo el parque para completar la misión.
solution:
  explanation: El Monte Aloia combina naturaleza, miradores, senderismo y patrimonio
    arqueológico. La misión utiliza esos elementos para convertir una visita gratuita
    en una experiencia de exploración.
badge:
  name: ORIXE 014 · Explorador del Aloia
  description: Insignia de quien convirtió el Monte Aloia en un mapa de aventura.
  image: /badges/monte-aloia.svg
