descriptionLong: Una misión de Orixe pensada para familias y grupos que quieren descubrir Galicia jugando, sin pagar por realizar
  el reto.
image: /images/pazo-de-arxeriz.svg
story:
  title: El misterio de Ecomuseo Pazo de Arxeriz
  introduction: El lugar es el tablero. Las pistas están a la vista y la historia es la llave.
  historicalContext: Investiga el contexto histórico y cultural de Ecomuseo Pazo de Arxeriz utilizando la información disponible
    en el lugar y las fuentes oficiales de turismo.
  mystery: Un antiguo cuaderno dejó cinco pruebas sin resolver. Solo podrás abrir el mensaje final si conectas lo que observas
    con la historia del lugar.
mission:
  objective: Descubrir qué cuenta Ecomuseo Pazo de Arxeriz sobre la historia, cultura o patrimonio de Galicia.
  location: Ecomuseo Pazo de Arxeriz, O Saviñao.
  instructions:
  - Lee la misión antes de comenzar.
  - Trabaja en equipo.
  - No toques ni muevas elementos patrimoniales.
  - Respeta horarios y zonas restringidas.
  - No leas la solución hasta terminar.
materials:
- Ficha imprimible
- Lápiz
- Móvil opcional
challenge:
  title: 'Reto: La memoria de la Ribeira Sacra'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Busca elementos que relacionen vivienda, trabajo y río.
  - type: search
    prompt: Investiga qué es un ecomuseo.
  - type: history
    prompt: Explica por qué conservar objetos mantiene la memoria.
  - type: puzzle
    prompt: Une paisaje + trabajo + memoria.
  - type: final
    prompt: Construye el mensaje final.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Ecomuseo Pazo de Arxeriz.
    No se trata solo de memorizar un dato, sino de explicar la conexión entre las pistas.
