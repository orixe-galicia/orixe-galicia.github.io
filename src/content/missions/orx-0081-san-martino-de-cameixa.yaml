challenge:
  title: 'Reto: El románico de Cameixa'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Localiza portada, capitel y ábside.
  - type: search
    prompt: Averigua el siglo de la iglesia.
  - type: history
    prompt: Identifica dos rasgos románicos.
  - type: puzzle
    prompt: Une arco + capitel + ábside.
  - type: final
    prompt: Explica qué pista demuestra su antigüedad.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Igrexa de San Martiño
    de Cameixa. No se trata solo de memorizar un dato, sino de explicar la conexión entre las pistas.
