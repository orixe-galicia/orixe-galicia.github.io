story:
  title: El misterio de Igrexa de San Martiño de Cameixa
  introduction: El lugar es el tablero. Las pistas están a la vista y la historia es la llave.
  historicalContext: Investiga el contexto histórico y cultural de Igrexa de San Martiño de Cameixa utilizando la información
    disponible en el lugar y las fuentes oficiales de turismo.
  mystery: Un antiguo cuaderno dejó cinco pruebas sin resolver. Solo podrás abrir el mensaje final si conectas lo que observas
    con la historia del lugar.
mission:
  objective: Descubrir qué cuenta Igrexa de San Martiño de Cameixa sobre la historia, cultura o patrimonio de Galicia.
  location: Igrexa de San Martiño de Cameixa, Boborás.
  instructions:
  - Lee la misión antes de comenzar.
  - Trabaja en equipo.
  - No toques ni muevas elementos patrimoniales.
  - Respeta horarios y zonas restringidas.
  - No leas la solución hasta terminar.
