  lat: 43.28
  lng: -8.214
category: Historia y ciudad
ageRecommended: 8-14 años
duration: 60 min
distance: 2 km aprox.
difficulty: Fácil
accessibility: Recorrido urbano por calles y plazas públicas.
image: /images/betanzos.svg
gallery: []
descriptionShort: Conviértete en detective y descubre la historia de Betanzos buscando pistas en sus calles.
descriptionLong: El casco histórico de Betanzos conserva iglesias, plazas, soportales, casas y restos de su pasado medieval.
  Esta misión convierte la ciudad en un juego de detectives.
story:
  title: El expediente de los tres escudos
  introduction: 'Un investigador dejó tres escudos como pistas. No tienes que entrar en ningún edificio: basta con mirar fachadas,
    plazas y detalles del casco histórico.'
  historicalContext: Betanzos conserva un importante conjunto histórico y fue una de las antiguas capitales de las provincias
    del antiguo Reino de Galicia.
  mystery: 'Un investigador dejó tres escudos como pistas. No tienes que entrar en ningún edificio: basta con mirar fachadas,
    plazas y detalles del casco histórico.'
mission:
  objective: Recorrer el centro histórico y localizar tres tipos de señales arquitectónicas.
  location: Casco histórico de Betanzos.
  instructions:
  - Realiza la misión desde calles y plazas públicas.
  - No fotografíes a personas sin permiso.
  - No toques elementos patrimoniales.
  - Camina con atención al tráfico y a las calles empedradas.
materials:
- Ficha
- Lápiz o móvil
challenge:
  title: 'Reto final: Resolver el expediente'
  introduction: Busca, compara y decide qué pista pertenece a cada época.
  steps:
  - type: search
    title: Piedra
    prompt: Encuentra un edificio donde la piedra tenga un papel protagonista.
    answer: Respuesta abierta
    hint: Busca una fachada monumental.
  - type: observation
    title: Soportales
    prompt: Localiza una calle o plaza con soportales.
    answer: Respuesta abierta
    hint: Mira las plantas bajas.
  - type: history
    title: Las iglesias
    prompt: Anota el nombre de una iglesia del casco histórico.
    answer: Respuesta abierta
    hint: Hay varias opciones.
  - type: observation
    title: El escudo
    prompt: Encuentra un escudo o símbolo heráldico en una fachada.
    answer: Respuesta abierta
    hint: No hace falta tocarlo.
  - type: final
    title: El detective
    prompt: ¿Qué palabra resume mejor el recorrido? CIUDAD, HISTORIA o BOSQUE.
    answer: HISTORIA
    hint: Todo el juego gira alrededor del pasado urbano.
  successCondition: Completar cinco pruebas y elegir HISTORIA.
clues:
- Mira hacia arriba.
- Los detalles pequeños son más importantes que los monumentos famosos.
- No necesitas entrar en ningún edificio.
solution:
  explanation: 'El casco histórico de Betanzos funciona como escenario de una investigación: soportales, iglesias, fachadas
    y escudos permiten observar la continuidad de su historia urbana.'
badge:
  name: ORIXE 016 · Detective de Betanzos
  description: Insignia de quien resolvió el expediente de los tres escudos.
  image: /badges/betanzos.svg
googleMaps: https://www.google.com/maps/search/?api=1&query=43.280,-8.214
recommendations:
- La misión está diseñada para realizarse sin contratar una actividad guiada.
- Comprueba horarios, accesos y condiciones del lugar antes de salir.
warnings:
- Respeta siempre la señalización y las zonas restringidas.
- La seguridad está por encima de cualquier prueba.
