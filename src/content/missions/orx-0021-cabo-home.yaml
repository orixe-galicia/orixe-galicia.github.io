id: ORX-0021
slug: cabo-home
title: El faro de los tres mares
subtitle: Orientación, costa y una misión mirando al horizonte
municipality: Cangas
province: Pontevedra
coordinates:
  lat: 42.274
  lng: -8.872
category: Naturaleza y orientación
ageRecommended: 8-14 años
duration: 60-75 min
distance: 2 km aprox.
difficulty: Fácil-media
accessibility: Senderos y caminos; algunas zonas tienen desnivel.
image: /images/cabo-home.svg
gallery: []
descriptionShort: Convierte Cabo Home en un juego de orientación entre faros, mar
  y paisaje.
descriptionLong: Cabo Home forma parte de la Costa da Vela y ofrece un paisaje atlántico
  marcado por acantilados y faros. La misión propone orientarse sin necesidad de aplicaciones.
story:
  title: El vigía del horizonte
  introduction: 'Un vigía perdió su brújula. Solo recuerda tres cosas: dónde sale
    el sol, dónde está la tierra y dónde está el faro. Tu equipo debe reconstruir
    su orientación.'
  historicalContext: Cabo Home se encuentra en la Costa da Vela, frente a las islas
    Cíes y con varios elementos de señalización marítima.
  mystery: 'Un vigía perdió su brújula. Solo recuerda tres cosas: dónde sale el sol,
    dónde está la tierra y dónde está el faro. Tu equipo debe reconstruir su orientación.'
mission:
  objective: Aprender a orientarse mediante referencias naturales y humanas del paisaje.
  location: Entorno exterior de Cabo Home.
  instructions:
  - No te acerques a los bordes de los acantilados.
  - Mantente en caminos y zonas seguras.
  - No necesitas llegar a todos los faros para completar la misión.
  - Consulta la meteorología antes de salir.
materials:
- Ficha
- Lápiz
- Móvil opcional
challenge:
  title: 'Reto final: Recuperar la brújula'
  introduction: Cinco pruebas para aprender a leer el horizonte.
  steps:
  - type: coordinates
    title: El mar
    prompt: ¿Qué dirección general ocupa el océano desde el cabo?
    answer: Oeste
    hint: Usa una brújula si quieres comprobarlo.
  - type: observation
    title: El faro
    prompt: ¿Qué función tiene un faro?
    answer: Ayudar a la navegación
    hint: No es solo un edificio bonito.
  - type: search
    title: Las islas
    prompt: ¿Qué conjunto de islas puedes identificar frente a la costa en días despejados?
    answer: Islas Cíes
    hint: La visibilidad depende del tiempo.
  - type: observation
    title: El horizonte
    prompt: Anota dos elementos que puedas utilizar como referencias.
    answer: Respuesta abierta
    hint: Montes, faros, islas...
  - type: final
    title: La palabra
    prompt: ¿Qué habilidad has utilizado? ORIENTAR, ESCONDER o COCINAR.
    answer: ORIENTAR
    hint: Ese es el objetivo.
  successCondition: Completar cinco pruebas y obtener ORIENTAR.
clues:
- El horizonte es tu mapa.
- Un faro sirve para orientar a los navegantes.
- No necesitas acercarte a ningún precipicio.
solution:
  explanation: Cabo Home permite trabajar orientación a partir de faros, horizonte,
    costa e islas. La misión está diseñada para hacerse desde caminos seguros.
badge:
  name: ORIXE 021 · Vigía de Cabo Home
  description: Insignia de quien aprendió a orientarse mirando el horizonte.
  image: /badges/cabo-home.svg
googleMaps: https://www.google.com/maps/search/?api=1&query=42.274,-8.872
recommendations:
- La misión está diseñada para realizarse sin contratar una actividad guiada.
- Comprueba horarios, accesos y condiciones del lugar antes de salir.
warnings:
- Respeta siempre la señalización y las zonas restringidas.
- La seguridad está por encima de cualquier prueba.
