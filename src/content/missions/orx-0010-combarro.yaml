recommendations:
- Haz el recorrido con calma para observar detalles que suelen pasar desapercibidos.
- Puedes combinar la misión con un paseo por la costa de Combarro.
warnings:
- Hay calles estrechas y zonas con mucha afluencia.
- No subas a hórreos, muros ni elementos patrimoniales.
