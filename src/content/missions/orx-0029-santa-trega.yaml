id: ORX-0029
slug: santa-trega-mirador
title: La frontera de dos mundos
subtitle: Un reto castrexo sobre el Miño y el Atlántico
municipality: A Guarda
province: Pontevedra
coordinates:
  lat: 41.89331
  lng: -8.86969
category: Arqueología y paisaje
ageRecommended: 8-14 años
duration: 75 min
distance: 1,5 km aprox.
difficulty: Media
accessibility: Entorno de montaña con pendientes; escoger recorrido según condiciones.
descriptionShort: Descubre el Castro de Santa Trega y su posición estratégica sobre
  el Miño y Portugal.
descriptionLong: Una misión gratuita para observar el paisaje y las estructuras del
  castro, entendiendo por qué la ubicación fue estratégica mucho antes del turismo.
story:
  title: Dos países, un solo horizonte
  introduction: 'Desde lo alto de Santa Trega se ve el Miño, el Atlántico y Portugal.
    Pero hace siglos esa vista no era una postal: era información estratégica.'
  historicalContext: Turismo de Galicia destaca la panorámica desde el Castro de Santa
    Trega y explica que su ubicación respondía a razones estratégicas y de seguridad,
    con control del tráfico marítimo y de la desembocadura del Miño.
  mystery: Debes demostrar que el lugar fue elegido por estrategia y no solo por belleza.
mission:
  objective: Interpretar el paisaje desde el punto de vista de una comunidad castrexa.
  location: Entorno público del Monte y Castro de Santa Trega.
  instructions:
  - Utiliza senderos y miradores señalizados.
  - No entres en zonas arqueológicas cerradas.
  - Observa el paisaje desde lugares seguros.
  - No necesitas acceder al museo para completar la misión.
materials:
- Ficha
- Lápiz
challenge:
  title: 'Reto final: El mapa del vigilante'
  introduction: Piensa como alguien que debía controlar un territorio desde lo alto.
  steps:
  - type: observation
    title: El río
    prompt: ¿Qué gran río puedes identificar en el paisaje?
    answer: Miño
    hint: Marca parte de la frontera con Portugal.
  - type: search
    title: El océano
    prompt: ¿Qué gran masa de agua aparece hacia el oeste?
    answer: Atlántico
    hint: Es el océano.
  - type: history
    title: La estrategia
    prompt: ¿Por qué se eligió la ubicación del castro?
    answer: Por razones estratégicas y de seguridad
    hint: No fue solo por las vistas.
  - type: photo
    title: La frontera
    prompt: Haz una fotografía del paisaje donde se aprecie el río y el territorio
      del otro lado.
    answer: Panorámica del Miño
    hint: Busca un punto seguro.
  - type: final
    title: La clave
    prompt: '¿Qué palabra define mejor Santa Trega para un habitante antiguo: MIRADOR,
      FORTALEZA o PARKING?'
    answer: FORTALEZA
    hint: Piensa en seguridad.
  successCondition: Completar las cinco pruebas y responder FORTALEZA.
clues:
- Las mejores vistas también podían ser información.
- El Miño es una pista enorme.
- Observa antes de responder.
solution:
  explanation: Santa Trega está en una posición elevada con vistas sobre el Miño,
    Portugal y el Atlántico. Turismo de Galicia destaca precisamente su valor estratégico
    para controlar el tráfico marítimo y la desembocadura del río.
