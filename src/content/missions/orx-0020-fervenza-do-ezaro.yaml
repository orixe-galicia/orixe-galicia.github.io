challenge:
  title: "Reto final: Medir sin metro"
  introduction: "Usa tus ojos para descubrir cómo cambia la energía del agua."
  steps:
    - type: "observation"
      title: "El salto"
      prompt: "¿Qué hace el agua cuando llega al borde?"
      answer: "Cae"
      hint: "Observa el movimiento."
    - type: "science"
      title: "La altura"
      prompt: "¿Qué tiene más energía potencial: el agua arriba o abajo?"
      answer: "Arriba"
      hint: "La altura importa."
    - type: "observation"
      title: "El paisaje"
      prompt: "¿Qué elementos aparecen alrededor del río?"
      answer: "Respuesta abierta"
      hint: "Anota tres."
    - type: "reasoning"
      title: "El recorrido"
      prompt: "¿El agua se detiene definitivamente al caer?"
      answer: "No"
      hint: "Continúa hacia el mar."
    - type: "final"
      title: "La palabra"
      prompt: "¿Qué palabra resume el reto? AGUA, PIEDRA o NUBE."
      answer: "AGUA"
      hint: "Es el hilo conductor."
  successCondition: "Completar las cinco pruebas y obtener AGUA."
clues:
  - "Piensa en arriba y abajo."
  - "El río no termina en la cascada."
  - "La seguridad está por encima de cualquier pista."
solution:
