story:
  title: "El río que cae al océano"
  introduction: "Un científico dejó cinco preguntas junto al río. Todas tienen una pista común: el agua nunca deja de moverse."
  historicalContext: "La Fervenza do Ézaro es uno de los saltos de agua más conocidos de Galicia y se encuentra en la desembocadura del río Xallas."
