descriptionLong: "Ponte Maceira reúne puente medieval, casas, molinos, capilla y paisaje fluvial. La misión propone leer el lugar como si fuera una escena de una aventura."
story:
  title: "El puente que no quería olvidar"
  introduction: "Un peregrino perdió su diario antes de cruzar el río. Solo dejó cinco descripciones. Tu equipo debe descubrir qué elemento corresponde a cada una."
  historicalContext: "Ponte Maceira es un conjunto histórico ligado al río Tambre y al Camino de Santiago, con puente, capilla, molinos y arquitectura tradicional."
  mystery: "Un peregrino perdió su diario antes de cruzar el río. Solo dejó cinco descripciones. Tu equipo debe descubrir qué elemento corresponde a cada una."
mission:
  objective: "Identificar elementos del conjunto y reconstruir el mensaje del peregrino."
  location: "Ponte Maceira, Negreira."
  instructions:
    - "Permanece en las zonas públicas."
    - "No cruces el río fuera de los lugares habilitados."
    - "Observa los edificios desde el exterior."
    - "Respeta a vecinos y visitantes."
materials:
  - "Ficha"
  - "Lápiz"
  - "Móvil opcional"
challenge:
  title: "Reto final: El diario perdido"
  introduction: "Cinco pistas, cinco elementos del pueblo y una frase final."
  steps:
    - type: "observation"
      title: "La piedra"
      prompt: "¿Qué elemento permite cruzar el río?"
      answer: "El puente"
      hint: "Es el protagonista del conjunto."
    - type: "search"
      title: "El agua"
      prompt: "Busca un elemento relacionado con el aprovechamiento del agua."
      answer: "Molino"
      hint: "Mira junto al río."
    - type: "observation"
      title: "La tradición"
      prompt: "Encuentra una construcción religiosa pequeña."
      answer: "Capilla"
      hint: "No es la iglesia principal."
    - type: "history"
      title: "El camino"
      prompt: "¿Qué gran ruta de peregrinación está vinculada con este lugar?"
      answer: "Camino de Santiago"
      hint: "Piensa en los peregrinos."
    - type: "final"
      title: "La frase"
      prompt: "Completa: PIEDRA + AGUA + CAMINO = ..."
      answer: "HISTORIA"
      hint: "El lugar reúne las tres."
  successCondition: "Completar las cinco pruebas y obtener HISTORIA."
clues:
  - "El río es tu línea de orientación."
  - "Busca edificios pequeños además del puente."
  - "Imagina cómo vería el lugar un peregrino."
solution:
  explanation: "Ponte Maceira reúne puente, río, molinos, capilla y arquitectura tradicional dentro de un entorno relacionado con las rutas hacia Santiago. La palabra final es HISTORIA."
