story:
  title: El misterio de Mosteiro de San Xusto de Toxosoutos
  introduction: El lugar es el tablero. Las pistas están a la vista y la historia es la llave.
  historicalContext: Investiga el contexto histórico y cultural de Mosteiro de San Xusto de Toxosoutos utilizando la información
    disponible en el lugar y las fuentes oficiales de turismo.
  mystery: Un antiguo cuaderno dejó cinco pruebas sin resolver. Solo podrás abrir el mensaje final si conectas lo que observas
    con la historia del lugar.
mission:
  objective: Descubrir qué cuenta Mosteiro de San Xusto de Toxosoutos sobre la historia, cultura o patrimonio de Galicia.
  location: Mosteiro de San Xusto de Toxosoutos, Lousame.
  instructions:
  - Lee la misión antes de comenzar.
  - Trabaja en equipo.
  - No toques ni muevas elementos patrimoniales.
  - Respeta horarios y zonas restringidas.
  - No leas la solución hasta terminar.
materials:
- Ficha imprimible
- Lápiz
- Móvil opcional
challenge:
  title: 'Reto: El monasterio escondido del río'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Localiza agua, piedra y vegetación.
  - type: search
    prompt: Averigua cuándo fue fundado.
  - type: history
    prompt: Relaciona monasterio y territorio rural.
  - type: puzzle
    prompt: Une monasterio + río + molinos.
  - type: final
    prompt: Resume la vida histórica del lugar.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Mosteiro de San Xusto
    de Toxosoutos. No se trata solo de memorizar un dato, sino de explicar la conexión entre las pistas.
