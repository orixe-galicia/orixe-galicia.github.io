descriptionShort: "Una misión familiar gratuita por Combarro para descubrir hórreos, cruceiros y arquitectura marinera."
descriptionLong: "Combarro es un escenario perfecto para jugar: calles estrechas, casas marineras, hórreos y cruceiros convierten el conjunto histórico en un tablero de observación. La misión propone mirar los detalles que normalmente pasan desapercibidos."
story:
  title: "El secreto de las casas frente al mar"
  introduction: "Un antiguo habitante de Combarro dejó una nota: «No busques una puerta secreta. Busca las cosas que todos ven y casi nadie mira». Para abrir el mensaje final tendrás que localizar cinco detalles del pueblo."
  historicalContext: "Combarro, en Poio, fue declarado conjunto histórico y conserva una importante concentración de arquitectura popular marinera. Entre sus elementos destacados están los hórreos del siglo XVIII, los cruceiros de los siglos XVIII-XIX y las casas marineras de los siglos XVII-XVIII. Los hórreos se elevan sobre pilares y servían para almacenar y secar cosechas."
  mystery: "Cada elemento observado revela cómo se relacionaban mar, agricultura y vida cotidiana."
mission:
  objective: "Recorrer el conjunto histórico de Combarro y reconocer los elementos que explican su arquitectura popular."
  location: "Conjunto histórico de Combarro, Poio."
  instructions:
    - "Comenzad en el conjunto histórico y caminad siempre por zonas públicas."
    - "Observad sin tocar ni apoyaros en elementos patrimoniales."
    - "Las respuestas se pueden obtener desde el exterior."
    - "En calles estrechas, dad prioridad a residentes y peatones."
materials:
  - "Esta ficha"
  - "Lápiz o bolígrafo"
  - "Móvil opcional para ampliar una pista"
challenge:
  title: "Reto final: El pueblo habla"
  introduction: "En Combarro casi todo puede convertirse en una pista si sabes qué mirar."
  steps:
    - type: "observation"
      title: "El granero elevado"
      prompt: "¿Cómo se llama la construcción tradicional elevada sobre pilares que aparece por todo Combarro?"
      answer: "hórreo"
      hint: "Sirve para guardar cosechas."
    - type: "observation"
      title: "La cruz del camino"
      prompt: "¿Cómo se llama el elemento de piedra formado por una cruz sobre un soporte que aparece en muchas calles gallegas?"
      answer: "cruceiro"
      hint: "Es una palabra muy gallega."
    - type: "history"
      title: "Los hórreos de Combarro"
      prompt: "¿De qué siglo son los hórreos destacados del conjunto histórico según Turismo de Galicia?"
      answer: "siglo XVIII"
      hint: "Está entre 1700 y 1800."
    - type: "observation"
      title: "La casa marinera"
      prompt: "Busca una vivienda tradicional que te permita ver la relación entre el pueblo y el mar. ¿Qué tipo de arquitectura aparece junto a los hórreos?"
      answer: "casas marineras"
      hint: "El propio nombre es la pista."
    - type: "puzzle"
      title: "Tres mundos"
      prompt: "Relaciona HÓRREO + CASA MARINERA + CRUCEIRO. ¿Qué cuentan juntos sobre Combarro?"
      answer: "Que la vida tradicional combinaba agricultura, mar y comunidad."
      hint: "Piensa en para qué servía cada elemento."
    - type: "final"
      title: "La frase escondida"
      prompt: "Explica por qué Combarro es más que un lugar bonito para hacer fotos."
      answer: "Porque conserva un conjunto histórico que muestra cómo vivía una comunidad marinera y agrícola."
      hint: "Habla de patrimonio y vida cotidiana."
  successCondition: "Completar las pruebas y explicar la relación entre arquitectura popular, agricultura, mar y vida comunitaria."
clues:
  - "Busca algo elevado sobre pilares."
  - "Una cruz de piedra puede ser una pista."
  - "No todos los elementos relacionados con el mar están en el agua."
solution:
  explanation: "Combarro conserva una concentración excepcional de arquitectura popular marinera. Los hórreos, cruceiros y casas marineras permiten entender cómo se combinaban el almacenamiento de cosechas, la vida comunitaria y la relación con el mar."
