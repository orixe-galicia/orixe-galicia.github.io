story:
  title: El misterio de Mosteiro de Santa Cristina de Ribas de Sil
  introduction: El lugar es el tablero. Las pistas están a la vista y la historia es la llave.
  historicalContext: Investiga el contexto histórico y cultural de Mosteiro de Santa Cristina de Ribas de Sil utilizando la
    información disponible en el lugar y las fuentes oficiales de turismo.
  mystery: Un antiguo cuaderno dejó cinco pruebas sin resolver. Solo podrás abrir el mensaje final si conectas lo que observas
    con la historia del lugar.
mission:
  objective: Descubrir qué cuenta Mosteiro de Santa Cristina de Ribas de Sil sobre la historia, cultura o patrimonio de Galicia.
  location: Mosteiro de Santa Cristina de Ribas de Sil, Parada de Sil.
  instructions:
  - Lee la misión antes de comenzar.
  - Trabaja en equipo.
  - No toques ni muevas elementos patrimoniales.
  - Respeta horarios y zonas restringidas.
  - No leas la solución hasta terminar.
materials:
- Ficha imprimible
- Lápiz
- Móvil opcional
challenge:
  title: 'Reto: Los monjes del bosque'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Busca arquitectura y bosque en un mismo encuadre.
  - type: search
    prompt: Averigua cuándo fue declarado BIC.
  - type: history
    prompt: Explica el papel de los monasterios en la Ribeira Sacra.
  - type: puzzle
    prompt: Une bosque + monasterio + territorio.
  - type: final
    prompt: Resume su valor patrimonial.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Mosteiro de Santa Cristina
    de Ribas de Sil. No se trata solo de memorizar un dato, sino de explicar la conexión entre las pistas.
