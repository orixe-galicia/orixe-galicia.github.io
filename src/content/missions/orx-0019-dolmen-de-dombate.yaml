descriptionShort: Viaja a la prehistoria con un juego de observación en el Dolmen
  de Dombate.
descriptionLong: El Dolmen de Dombate es uno de los monumentos megalíticos más conocidos
  de Galicia. La misión invita a observar su estructura y pensar como un arqueólogo.
story:
  title: El mensaje de los constructores
  introduction: No existen letras en las piedras de Dombate que expliquen exactamente
    cómo vivían sus constructores. Tu misión consiste en observar y formular hipótesis
    sin inventar respuestas.
  historicalContext: Dombate es un monumento megalítico destacado de Galicia, asociado
    a la arquitectura funeraria prehistórica y a la cultura megalítica.
  mystery: No existen letras en las piedras de Dombate que expliquen exactamente cómo
    vivían sus constructores. Tu misión consiste en observar y formular hipótesis
    sin inventar respuestas.
mission:
  objective: Comprender qué es un dolmen y diferenciar observación arqueológica de
    imaginación.
  location: Dolmen de Dombate, Cabana de Bergantiños.
  instructions:
  - No toques ni subas al monumento.
  - Observa las estructuras desde las zonas habilitadas.
  - Distingue siempre entre lo que ves y lo que imaginas.
  - Respeta el espacio arqueológico.
materials:
- Ficha
- Lápiz
challenge:
  title: 'Reto final: Pensar como arqueólogo'
  introduction: 'La prueba final no consiste en adivinar: consiste en justificar.'
  steps:
  - type: observation
    title: Las piedras
    prompt: ¿Qué material domina la construcción?
    answer: Piedra
    hint: Mira las grandes losas.
  - type: history
    title: El tipo de monumento
    prompt: ¿Cómo se llama este tipo de construcción megalítica?
    answer: Dolmen
    hint: Es una construcción funeraria.
  - type: observation
    title: La cámara
    prompt: Identifica la zona central del monumento.
    answer: Cámara
    hint: Es el espacio interior principal.
  - type: puzzle
    title: Hipótesis
    prompt: ¿Puedes afirmar exactamente para qué se utilizó sin consultar fuentes?
    answer: 'No'
    hint: La arqueología trabaja con evidencias.
  - type: final
    title: La palabra
    prompt: ¿Qué habilidad has utilizado más? OBSERVAR, CORRER o GRITAR.
    answer: OBSERVAR
    hint: Es la base del reto.
  successCondition: Completar las pruebas y obtener OBSERVAR.
clues:
- No confundas una hipótesis con un hecho.
- Mira primero la estructura completa.
- Las piedras son la fuente principal de pistas.
solution:
  explanation: 'El reto utiliza Dombate para introducir una idea sencilla de arqueología:
    observar evidencias y distinguirlas de las interpretaciones. El monumento pertenece
    al patrimonio megalítico gallego.'
