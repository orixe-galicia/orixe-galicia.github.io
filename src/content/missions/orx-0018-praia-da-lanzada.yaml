difficulty: Fácil
accessibility: Espacios exteriores públicos; adaptar la visita a la marea y al estado
  del mar.
image: /images/praia-da-lanzada.svg
gallery: []
descriptionShort: Explora A Lanzada con un reto gratuito de observación sobre paisaje,
  patrimonio y mareas.
descriptionLong: A Lanzada reúne playa, dunas, restos arqueológicos y una ermita junto
  al Atlántico. La misión convierte el lugar en un tablero donde el paisaje cambia
  con la marea.
story:
  title: La pista que desaparece
  introduction: 'Una pista aparece en la arena y desaparece cuando sube la marea.
    No tienes que buscarla literalmente: debes descubrir qué elementos del lugar cambian
    y cuáles permanecen.'
  historicalContext: El entorno de A Lanzada combina patrimonio arqueológico y religioso
    con un paisaje costero de gran valor.
  mystery: 'Una pista aparece en la arena y desaparece cuando sube la marea. No tienes
    que buscarla literalmente: debes descubrir qué elementos del lugar cambian y cuáles
    permanecen.'
mission:
  objective: Observar el entorno y distinguir elementos naturales, arqueológicos y
    religiosos.
  location: Entorno exterior de A Lanzada.
  instructions:
  - Consulta la marea antes de acercarte a zonas intermareales.
  - No entres en el mar para completar ninguna prueba.
  - No pises dunas protegidas.
  - La misión se puede completar desde zonas seguras.
materials:
- Ficha
- Lápiz
- Móvil opcional
challenge:
  title: 'Reto final: La pista que cambia'
  introduction: Cinco pruebas para descubrir qué cuenta el paisaje.
  steps:
  - type: observation
    title: Arena y mar
    prompt: ¿Qué elemento cambia continuamente de posición?
    answer: La línea del agua
    hint: Observa la orilla.
  - type: search
    title: Patrimonio
    prompt: Localiza una construcción religiosa visible en el entorno.
    answer: Ermita de A Lanzada
    hint: Busca su silueta.
  - type: history
    title: Arqueología
    prompt: ¿Qué tipo de patrimonio también existe en la zona?
    answer: Restos arqueológicos
    hint: No hace falta excavar ni tocar nada.
  - type: observation
    title: Dunas
    prompt: ¿Por qué no debes caminar libremente sobre las dunas?
    answer: Porque son un ecosistema frágil
    hint: Respeta los caminos.
  - type: final
    title: La palabra
    prompt: ¿Qué palabra resume mejor la misión? MAREA, PARKING o CIUDAD.
    answer: MAREA
    hint: Es la gran pista del lugar.
  successCondition: Completar cinco pruebas y obtener MAREA.
clues:
- La línea del agua es tu reloj.
- Mira también hacia tierra.
- Nunca hace falta entrar en zonas peligrosas.
solution:
  explanation: A Lanzada permite observar cómo se relacionan mar, arena, dunas y patrimonio.
    La misión usa la marea como elemento narrativo sin exigir entrar en el agua ni
    acceder a zonas protegidas.
badge:
  name: ORIXE 018 · Guardián de la Marea
  description: Insignia de quien descubrió la pista que cambia con el Atlántico.
  image: /badges/praia-da-lanzada.svg
googleMaps: https://www.google.com/maps/search/?api=1&query=42.403,-8.878
recommendations:
- La misión está diseñada para realizarse sin contratar una actividad guiada.
- Comprueba horarios, accesos y condiciones del lugar antes de salir.
warnings:
- Respeta siempre la señalización y las zonas restringidas.
- La seguridad está por encima de cualquier prueba.
