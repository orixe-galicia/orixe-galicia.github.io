story:
  title: El misterio de Torres de Mens
  introduction: El lugar es el tablero. Las pistas están a la vista y la historia es la llave.
  historicalContext: Investiga el contexto histórico y cultural de Torres de Mens utilizando la información disponible en
    el lugar y las fuentes oficiales de turismo.
  mystery: Un antiguo cuaderno dejó cinco pruebas sin resolver. Solo podrás abrir el mensaje final si conectas lo que observas
    con la historia del lugar.
mission:
  objective: Descubrir qué cuenta Torres de Mens sobre la historia, cultura o patrimonio de Galicia.
  location: Torres de Mens, Malpica de Bergantiños.
  instructions:
  - Lee la misión antes de comenzar.
  - Trabaja en equipo.
  - No toques ni muevas elementos patrimoniales.
  - Respeta horarios y zonas restringidas.
  - No leas la solución hasta terminar.
materials:
- Ficha imprimible
