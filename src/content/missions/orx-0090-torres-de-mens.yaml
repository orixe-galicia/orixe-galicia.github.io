challenge:
  title: 'Reto: La fortaleza junto al mar'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Localiza elementos defensivos.
  - type: search
    prompt: Investiga qué era una torre medieval.
  - type: history
    prompt: Relaciona nobleza + defensa + territorio.
  - type: puzzle
    prompt: Une costa + torre + poder.
  - type: final
    prompt: Explica el mensaje de la fortaleza.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Torres de Mens. No se
    trata solo de memorizar un dato, sino de explicar la conexión entre las pistas.
