story:
  title: El misterio de Castelo de Andrade
  introduction: El lugar es el tablero. Las pistas están a la vista y la historia es la llave.
  historicalContext: Investiga el contexto histórico y cultural de Castelo de Andrade utilizando la información disponible
    en el lugar y las fuentes oficiales de turismo.
  mystery: Un antiguo cuaderno dejó cinco pruebas sin resolver. Solo podrás abrir el mensaje final si conectas lo que observas
    con la historia del lugar.
mission:
  objective: Descubrir qué cuenta Castelo de Andrade sobre la historia, cultura o patrimonio de Galicia.
  location: Castelo de Andrade, Pontedeume.
  instructions:
  - Lee la misión antes de comenzar.
  - Trabaja en equipo.
  - No toques ni muevas elementos patrimoniales.
  - Respeta horarios y zonas restringidas.
  - No leas la solución hasta terminar.
materials:
- Ficha imprimible
- Lápiz
- Móvil opcional
challenge:
  title: 'Reto: El misterio de la fortaleza de Andrade'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Localiza tres elementos defensivos.
  - type: search
    prompt: Averigua el siglo de construcción.
  - type: history
    prompt: Relaciona defensa y territorio.
  - type: puzzle
    prompt: Une defensa + nobleza + paisaje.
  - type: final
    prompt: Explica por qué se construyó aquí.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Castelo de Andrade. No
    se trata solo de memorizar un dato, sino de explicar la conexión entre las pistas.
