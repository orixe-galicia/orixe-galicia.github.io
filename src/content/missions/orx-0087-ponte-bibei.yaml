image: /images/ponte-bibei.svg
story:
  title: El misterio de Ponte Bibei
  introduction: El lugar es el tablero. Las pistas están a la vista y la historia es la llave.
  historicalContext: Investiga el contexto histórico y cultural de Ponte Bibei utilizando la información disponible en el
    lugar y las fuentes oficiales de turismo.
  mystery: Un antiguo cuaderno dejó cinco pruebas sin resolver. Solo podrás abrir el mensaje final si conectas lo que observas
    con la historia del lugar.
mission:
  objective: Descubrir qué cuenta Ponte Bibei sobre la historia, cultura o patrimonio de Galicia.
  location: Ponte Bibei, Manzaneda.
  instructions:
  - Lee la misión antes de comenzar.
  - Trabaja en equipo.
  - No toques ni muevas elementos patrimoniales.
  - Respeta horarios y zonas restringidas.
  - No leas la solución hasta terminar.
materials:
- Ficha imprimible
- Lápiz
- Móvil opcional
challenge:
  title: 'Reto: La calzada que cruzó los siglos'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Observa la estructura del puente.
  - type: search
    prompt: Investiga qué significa obra romana.
  - type: history
    prompt: Explica por qué los puentes eran estratégicos.
  - type: puzzle
    prompt: Une camino + puente + territorio.
  - type: final
    prompt: Explica qué problema resolvía.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Ponte Bibei. No se trata
    solo de memorizar un dato, sino de explicar la conexión entre las pistas.
