descriptionShort: Una misión para descubrir cómo el agua transformó el paisaje y la vida de las personas alrededor de A Armenteira.
descriptionLong: El agua parece protagonista del paisaje de Meis, pero durante siglos fue también una herramienta de trabajo.
  En esta misión las familias siguen sus huellas, observan molinos y elementos de piedra y terminan reconstruyendo una historia
  que conecta el paisaje actual con el mundo medieval de Santa María de A Armenteira.
story:
  title: La carta que dejó de seguir el agua
  introduction: 'Al llegar a A Armenteira recibes una carta sin firma. Solo contiene una frase: «Si quieres saber qué ocurrió
    aquí, no busques primero en el monasterio. Sigue al agua y escucha las piedras».'
  historicalContext: La zona de A Armenteira conserva una relación muy estrecha entre naturaleza, arquitectura y aprovechamiento
    tradicional del agua. La Ruta da Pedra e da Auga permite reconocer numerosos molinos, saltos y canalizaciones. El monasterio
    de Santa María de A Armenteira conserva una iglesia románica levantada en 1167 y pertenece a la tradición cisterciense
    desde el siglo XII.
  mystery: La carta habla de cuatro señales. Cada una proporciona una palabra. Si consigues reunirlas en el orden correcto,
    descubrirás qué debía proteger el antiguo guardián del lugar.
mission:
  objective: Recorrer el entorno de A Armenteira, observar elementos del paisaje y reconstruir una pequeña historia local
    a partir de cuatro pistas.
  location: Entorno de Santa María de A Armenteira y comienzo del recorrido de la Ruta da Pedra e da Auga.
  instructions:
  - Comenzad en un punto seguro próximo al monasterio.
  - Leed cada pista antes de avanzar y observad el entorno antes de responder.
  - No es necesario entrar en ninguna propiedad ni tocar elementos patrimoniales.
  - 'Anotad las cuatro palabras obtenidas: serán necesarias para el Reto Final.'
materials:
- Lápiz o bolígrafo
- Esta ficha
- Móvil opcional para consultar un dato histórico
challenge:
  title: 'Reto final: El mensaje del guardián'
  introduction: Ya tienes cuatro palabras. Ahora debes demostrar que has entendido el lugar y no solo encontrado las respuestas.
  steps:
  - type: observation
    title: La primera señal
    prompt: Busca un molino o un elemento relacionado con el antiguo aprovechamiento del agua. ¿Qué fuerza natural hacía posible
      su funcionamiento?
    answer: agua
    hint: Piensa en el elemento que acompaña el recorrido.
  - type: history
    title: La segunda señal
    prompt: El monasterio de A Armenteira conserva una iglesia románica levantada en el siglo XII. ¿Qué año aparece asociado
      a la construcción indicada en la información histórica?
    answer: '1167'
    hint: Es un número de cuatro cifras.
  - type: observation
    title: La tercera señal
    prompt: Observa la arquitectura de piedra. ¿Qué material domina visualmente muchos de los elementos tradicionales del
      recorrido?
    answer: piedra
    hint: Está en el propio nombre de la ruta.
  - type: history
    title: La cuarta señal
    prompt: ¿Qué orden religiosa está vinculada a Santa María de A Armenteira desde el siglo XII?
    answer: cisterciense
    hint: Empieza por C.
  - type: puzzle
    title: Ordena las pistas
    prompt: 'Forma la idea que une estas respuestas: AGUA + PIEDRA + CISTERCIENSE + 1167. ¿Qué cuentan juntas?'
    answer: La historia y el paisaje de A Armenteira
    hint: Busca la conexión entre naturaleza, trabajo y patrimonio.
  - type: final
    title: La prueba del guardián
    prompt: Explica en una frase por qué el agua puede considerarse parte de la historia del lugar y no solo del paisaje.
    answer: Porque durante generaciones fue aprovechada para mover molinos y organizar actividades humanas.
    hint: Piensa en el trabajo de las personas.
  successCondition: Completar las cuatro pistas y explicar correctamente la relación entre agua, piedra, molinos y patrimonio
    histórico.
clues:
- La primera pista está relacionada con la fuerza que mueve.
- La fecha histórica pertenece al monasterio.
- Una de las respuestas está escondida en el propio nombre de la ruta.
solution:
  explanation: 'La misión conduce a entender que el paisaje no es decorado: es memoria. El agua fue aprovechada para mover
    molinos y organizar actividades humanas, mientras la piedra conserva buena parte de esa historia. El monasterio de A Armenteira,
    vinculado a la tradición cisterciense y con una iglesia románica levantada en 1167, añade la dimensión medieval al recorrido.'
