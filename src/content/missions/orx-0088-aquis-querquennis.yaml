challenge:
  title: 'Reto: La ciudad militar junto al Miño'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Identifica murallas y espacios interiores.
  - type: search
    prompt: Investiga qué era un campamento romano.
  - type: history
    prompt: Relaciona ejército y vías de comunicación.
  - type: puzzle
    prompt: Reconstruye una ruta entre campamento y territorio.
  - type: final
    prompt: Explica qué enseña sobre la romanización.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Aquis Querquennis. No
    se trata solo de memorizar un dato, sino de explicar la conexión entre las pistas.
