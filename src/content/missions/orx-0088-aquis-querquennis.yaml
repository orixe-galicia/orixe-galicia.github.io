mission:
  objective: Descubrir qué cuenta Aquis Querquennis sobre la historia, cultura o patrimonio de Galicia.
  location: Aquis Querquennis, Bande.
  instructions:
  - Lee la misión antes de comenzar.
  - Trabaja en equipo.
  - No toques ni muevas elementos patrimoniales.
  - Respeta horarios y zonas restringidas.
  - No leas la solución hasta terminar.
