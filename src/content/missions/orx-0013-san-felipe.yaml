descriptionShort: "Descubre el Castillo de San Felipe y reconstruye el sistema defensivo que protegía la entrada de la ría de Ferrol."
descriptionLong: "El Castillo de San Felipe es una de las grandes fortificaciones de la ría de Ferrol. Su posición, junto con el Castillo de A Palma y la antigua defensa de San Martiño, formaba un sistema pensado para controlar la entrada por mar. La misión convierte esa estrategia en un juego de observación."
story:
  title: "La cadena invisible"
  introduction: "Un vigía recibe una orden: «No necesitas disparar un cañón para defender una ría. Primero descubre cómo funciona el triángulo». Para entenderla tendrás que observar el castillo y el paisaje que lo rodea."
  historicalContext: "El Castillo de San Felipe se encuentra en una posición estratégica de la ría de Ferrol. Turismo de Ferrol señala que, junto con el Castillo de A Palma y el desaparecido Castillo de San Martiño, formaba un sistema defensivo conocido como el 'triángulo de fuego'. El castillo fue construido en el siglo XVI y reformado posteriormente."
  mystery: "La defensa no depende de un solo muro. La posición de las fortificaciones, el agua y la posibilidad de controlar el paso de barcos forman parte del mismo sistema."
mission:
  objective: "Comprender cómo el Castillo de San Felipe utilizaba su posición para controlar la entrada marítima a la ría de Ferrol."
  location: "Castillo de San Felipe y entorno exterior público."
  instructions:
    - "La visita por libre al castillo es gratuita según la información turística municipal; comprueba horarios antes de salir."
    - "No accedas a zonas cerradas ni cruces barreras de seguridad."
    - "Observa la ría y busca las posiciones de las otras fortificaciones."
    - "No necesitas contratar una visita guiada para completar la misión."
materials:
  - "Ficha de la misión"
  - "Lápiz o móvil"
  - "Calzado cómodo"
challenge:
  title: "Reto final: Activar la defensa"
  introduction: "Cinco pruebas te harán pensar como un vigía de la ría."
  steps:
    - type: "observation"
      title: "La posición"
      prompt: "¿Qué elemento natural controla el castillo desde su posición estratégica?"
      answer: "La entrada de la ría de Ferrol"
      hint: "Mira hacia el agua."
    - type: "history"
      title: "La construcción"
      prompt: "¿En qué siglo comenzó la construcción del Castillo de San Felipe?"
      answer: "Siglo XVI"
      hint: "Es el siglo de 1500."
    - type: "search"
      title: "El triángulo"
      prompt: "Además de San Felipe, ¿qué castillo situado enfrente formaba parte del sistema defensivo de la ría?"
      answer: "Castillo de A Palma"
      hint: "Está al otro lado de la ría, en Mugardos."
    - type: "observation"
      title: "La defensa invisible"
      prompt: "¿Qué debían controlar las fortificaciones para impedir la entrada de barcos enemigos?"
      answer: "El paso por la ría"
      hint: "No se trata de controlar una carretera."
    - type: "final"
      title: "La palabra final"
      prompt: "Une RÍA + SAN FELIPE + A PALMA + TRIÁNGULO. ¿Qué palabra resume la misión?"
      answer: "DEFENSA"
      hint: "Es el objetivo de todo el sistema."
  successCondition: "Completar las cinco pruebas y obtener la palabra final DEFENSA."
clues:
  - "Piensa en la ría como una puerta."
  - "Una fortaleza funciona mejor cuando se combina con otras posiciones."
  - "Mira hacia el otro lado del agua."
solution:
  explanation: "San Felipe fue construido en una posición estratégica para controlar la entrada a la ría de Ferrol. Junto con A Palma y la antigua defensa de San Martiño, formaba un sistema que permitía vigilar y dificultar el paso marítimo. La misión convierte esa estrategia en un reto de observación."
