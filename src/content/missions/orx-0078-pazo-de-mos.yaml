- Móvil opcional
challenge:
  title: 'Reto: La pista de los Marqueses de Mos'
  introduction: Cinco pruebas convierten la visita en un pequeño escape room gratuito.
  steps:
  - type: observation
    prompt: Busca tres pistas de arquitectura señorial.
  - type: search
    prompt: Averigua el siglo de construcción.
  - type: history
    prompt: Relaciona el pazo con la antigua calzada.
  - type: puzzle
    prompt: Ordena camino + pazo + marqueses.
  - type: final
    prompt: Explica qué historia cuenta el edificio.
  successCondition: Completar las cinco pruebas y justificar la respuesta final.
clues:
- Observa primero y busca información después.
- La arquitectura también cuenta historias.
- Relaciona el lugar con las personas que lo utilizaron.
solution:
  explanation: La solución debe relacionar las observaciones con el contexto histórico y cultural de Pazo de Mos. No se trata
    solo de memorizar un dato, sino de explicar la conexión entre las pistas.
