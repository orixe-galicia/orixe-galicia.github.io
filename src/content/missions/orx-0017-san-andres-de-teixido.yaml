image: /images/san-andres-de-teixido.svg
gallery: []
descriptionShort: Descubre San Andrés de Teixido a través de leyendas, símbolos y
  observación del paisaje.
descriptionLong: San Andrés de Teixido es uno de los lugares de peregrinación más
  conocidos de Galicia, rodeado de acantilados, mar y tradiciones populares. La misión
  utiliza la leyenda como motor de juego.
story:
  title: El viajero que llegó demasiado tarde
  introduction: 'Un viajero recibió una advertencia: «A San Andrés vai de morto o
    que non foi de vivo». Para descubrir qué significa tendrás que separar leyenda,
    paisaje y tradición.'
  historicalContext: San Andrés de Teixido es un conocido santuario de peregrinación
    de Galicia y un lugar asociado a numerosas tradiciones y leyendas populares.
  mystery: 'Un viajero recibió una advertencia: «A San Andrés vai de morto o que non
    foi de vivo». Para descubrir qué significa tendrás que separar leyenda, paisaje
    y tradición.'
mission:
  objective: Reconocer elementos del santuario y del paisaje y distinguir tradición
    de observación.
  location: San Andrés de Teixido y entorno público.
  instructions:
  - Mantente lejos de los bordes de los acantilados.
  - No recojas elementos naturales.
  - Respeta el santuario y las tradiciones locales.
  - Las pruebas pueden resolverse sin entrar en edificios.
materials:
- Ficha
- Lápiz
- Calzado cómodo
challenge:
  title: 'Reto final: Separar leyenda y realidad'
  introduction: No todo lo que escuchas en una leyenda es un dato. Tu reto es distinguir
    ambos.
  steps:
  - type: observation
    title: El santuario
    prompt: Identifica el edificio religioso que da nombre al lugar.
    answer: Santuario de San Andrés
    hint: Es el centro del núcleo.
  - type: history
    title: La frase
    prompt: ¿Qué idea expresa la famosa tradición de la peregrinación a San Andrés?
    answer: Que hay que ir en vida o hacerlo después de muerto
    hint: Es una tradición popular.
  - type: observation
    title: El paisaje
    prompt: Describe una característica del paisaje que rodea el santuario.
    answer: Acantilados y mar
    hint: Mira hacia la costa.
  - type: search
    title: Los símbolos
    prompt: Busca un elemento tradicional asociado a los peregrinos.
    answer: Respuesta abierta
    hint: Pregunta o observa sin tocar.
  - type: final
    title: La palabra
    prompt: '¿Qué mueve principalmente esta misión: LEYENDA o VELOCIDAD?'
    answer: LEYENDA
    hint: Aquí el relato forma parte del lugar.
  successCondition: Completar las cinco pruebas y obtener LEYENDA.
clues:
- No confundas una tradición con un dato científico.
- El paisaje es parte de la historia.
- Camina siempre por zonas seguras.
solution:
  explanation: San Andrés de Teixido combina santuario, peregrinación, paisaje costero
    y tradiciones populares. La misión invita a descubrir el lugar sin presentar las
    leyendas como hechos históricos.
badge:
