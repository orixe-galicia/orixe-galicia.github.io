descriptionShort: "Una misión gratuita en la Ribeira Sacra para descubrir el Cañón del Sil, sus miradores y la huella de los monasterios."
descriptionLong: "El paisaje de la Ribeira Sacra se convierte en un escape room natural. Desde el entorno de Parada de Sil, la familia tendrá que interpretar el relieve del Cañón del Sil, reconocer la viticultura en terrazas y relacionar el paisaje con los monasterios que dieron nombre a la comarca."
story:
  title: "El mensaje que baja por el Sil"
  introduction: "Una botella imaginaria ha llegado hasta el mirador con un mensaje: «El río ha escrito una historia en la montaña, pero solo quien sepa leer sus terrazas podrá entenderla». Cinco pistas esperan en el paisaje."
  historicalContext: "La Ribeira Sacra reúne territorios de las provincias de Lugo y Ourense articulados por los ríos Miño, Sil y Cabe. El Cañón del Sil se formó principalmente por la erosión fluvial y conserva miradores, monasterios e iglesias. En las laderas aparecen viñedos en socalcos, vinculados a la llamada viticultura heroica. Entre los monasterios destacados están Santo Estevo de Ribas de Sil y Santa Cristina."
  mystery: "Cada prueba identifica una pieza del paisaje. Al unirlas descubrirás por qué aquí naturaleza y patrimonio no pueden separarse."
mission:
  objective: "Observar el Cañón del Sil desde el entorno del Balcón de Madrid y relacionar paisaje, río, viñedo y patrimonio."
  location: "Entorno del Balcón de Madrid / Os Torgás, Parada de Sil."
  instructions:
    - "Comenzad en una zona segura del entorno del mirador."
    - "No os acerquéis a bordes ni zonas sin protección."
    - "Observad las laderas y el río antes de responder."
    - "No es necesario visitar ningún monasterio ni contratar actividades para completar la misión."
materials:
  - "Esta ficha"
  - "Lápiz o bolígrafo"
  - "Prismáticos opcionales"
challenge:
  title: "Reto final: Leer el paisaje"
  introduction: "El Cañón del Sil no es solo una vista bonita. Cada elemento cuenta una parte de la historia."
  steps:
    - type: "observation"
      title: "El río"
      prompt: "¿Qué río ha excavado el famoso cañón que estás observando?"
      answer: "Sil"
      hint: "Su nombre da nombre al Cañón del Sil."
    - type: "observation"
      title: "Las terrazas"
      prompt: "¿Cómo se llaman los escalones o terrazas donde se cultivan las vides en las laderas?"
      answer: "socalcos"
      hint: "También se conocen como bancales."
    - type: "history"
      title: "La Ribeira Sacra"
      prompt: "¿Desde qué siglo existe constancia escrita del nombre Ribeira Sacra?"
      answer: "siglo XII"
      hint: "Es la Edad Media."
    - type: "observation"
      title: "Los monasterios"
      prompt: "Nombra uno de los monasterios destacados de la zona del Sil."
      answer: "Santo Estevo de Ribas de Sil o Santa Cristina de Ribas de Sil"
      hint: "Cualquiera de los dos es válido."
    - type: "puzzle"
      title: "La viticultura heroica"
      prompt: "¿Por qué tiene sentido hablar de viticultura heroica en estas laderas?"
      answer: "Porque cultivar las vides en pendientes y socalcos requiere mucho esfuerzo."
      hint: "Mira la inclinación del terreno."
    - type: "final"
      title: "El mensaje del río"
      prompt: "Explica en una frase qué relación existe entre río, paisaje y actividad humana en la Ribeira Sacra."
      answer: "El río creó el paisaje y las personas lo aprovecharon para cultivar y construir su patrimonio."
      hint: "La respuesta debe conectar naturaleza y personas."
  successCondition: "Completar las pruebas y explicar cómo el río, las laderas, los viñedos y el patrimonio forman un mismo paisaje cultural."
clues:
  - "Mira primero el relieve y después las construcciones."
  - "Las terrazas son una pista importante."
  - "El nombre de la comarca también es una pista histórica."
solution:
  explanation: "La Ribeira Sacra combina un paisaje modelado por los ríos con una intensa huella humana. El Sil excavó el cañón y sus laderas fueron aprovechadas para la viticultura en socalcos; además, la zona conserva monasterios e iglesias ligados a la historia de la comarca."
badge:
  name: "Guardián del cañón"
  description: "Has aprendido a leer el paisaje de la Ribeira Sacra como una historia escrita entre agua, piedra y viñedos."
  image: "/badges/ribeira-sacra.svg"
