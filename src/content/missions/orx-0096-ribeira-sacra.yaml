image: /images/ribeira-sacra.svg
gallery: []
descriptionShort: Descubre el Cañón del Sil desde los miradores y resuelve un misterio sobre viñedos, río y monasterios.
descriptionLong: La Ribeira Sacra reúne el Cañón del Sil, viñedos en laderas, miradores y monasterios. Esta misión evita depender
  de entradas o paseos en barco y convierte el paisaje visible desde espacios públicos en un gran mapa que hay que interpretar.
story:
  title: El mapa que no estaba dibujado
  introduction: 'Un cartógrafo medieval dejó un mapa sin líneas. Solo escribió cuatro palabras: río, piedra, viña y monasterio.
    Tu equipo debe descubrir cómo esas cuatro piezas explican el paisaje de la Ribeira Sacra.'
  historicalContext: El Cañón del Sil forma un paisaje de grandes desniveles, con viñedos en bancales y numerosos monasterios
    y miradores. Turismo de Galicia destaca los cañones, las laderas de cultivo y lugares como Santa Cristina, Santo Estevo
    y los miradores de la zona.
  mystery: 'Aquí el mapa no se lee de izquierda a derecha: se lee de arriba abajo, siguiendo las laderas hasta el río. El
    reto consiste en interpretar cómo las personas han adaptado el territorio.'
mission:
  objective: Leer el paisaje de la Ribeira Sacra y explicar la relación entre río, laderas, viñedos y patrimonio.
  location: Entorno público del Mirador de Cabezoás y otros miradores próximos del Cañón del Sil.
  instructions:
  - Realiza la misión desde miradores y caminos públicos.
  - No es necesario contratar un paseo en catamarán ni entrar en monasterios.
  - Mantente siempre detrás de las barreras y en las zonas habilitadas.
  - Observa el paisaje antes de consultar las pistas.
materials:
- Ficha de la misión
- Lápiz o móvil
- Calzado cómodo
challenge:
  title: 'Reto final: Dibujar el paisaje'
  introduction: Cinco pruebas convierten lo que ves en un mapa. Al final tendrás que explicar por qué este paisaje es diferente.
  steps:
  - type: observation
    title: El protagonista
    prompt: ¿Qué río ha excavado el gran cañón que estás observando?
    answer: Sil
    hint: Da nombre al cañón.
  - type: observation
    title: Las escaleras verdes
    prompt: Observa las laderas. ¿Qué cultivo aparece organizado en bancales?
    answer: Viñedos
    hint: La Ribeira Sacra es famosa por sus vinos.
  - type: search
    title: Mirar desde arriba
    prompt: ¿Qué elemento permite contemplar el cañón desde una posición elevada sin necesidad de recorrerlo por agua?
    answer: Mirador
    hint: Estás en uno.
  - type: history
    title: Piedra y silencio
    prompt: Nombra uno de los monasterios destacados del entorno del Cañón del Sil.
    answer: Santa Cristina o Santo Estevo
    hint: Hay más de uno.
  - type: final
    title: La clave
    prompt: Une SIL + VIÑEDOS + MIRADORES + MONASTERIOS. ¿Qué palabra resume mejor lo que has descubierto?
    answer: PAISAJE
    hint: 'No es solo naturaleza: también es obra de las personas.'
  successCondition: Completar las cinco pruebas y obtener la palabra final PAISAJE.
clues:
- Mira las laderas, no solo el río.
- Los bancales cuentan una historia de adaptación al terreno.
- El paisaje mezcla naturaleza y trabajo humano.
solution:
  explanation: El Cañón del Sil combina un gran accidente natural con la transformación histórica de sus laderas mediante
    viñedos y bancales, además de un importante patrimonio monástico. Los miradores permiten interpretar ese conjunto sin
    necesidad de contratar una actividad.
badge:
  name: ORIXE 012 · Explorador de la Ribeira Sacra
  description: Insignia de quien aprendió a leer el mapa natural y humano del Cañón del Sil.
  image: /badges/ribeira-sacra.svg
googleMaps: https://www.google.com/maps/search/?api=1&query=42.373680,-7.604740
recommendations:
- Elige un mirador con buena visibilidad y evita las horas de mayor calor.
- Puedes ampliar la experiencia visitando otros miradores del Cañón del Sil.
warnings:
- Hay miradores con gran altura y desniveles.
- No te acerques a los bordes ni abandones las zonas habilitadas.
